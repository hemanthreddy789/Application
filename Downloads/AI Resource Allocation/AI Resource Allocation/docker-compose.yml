version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_resource_postgres
    environment:
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_secure_password_2026
      POSTGRES_DB: ai_resource_allocation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_resource_allocation"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai_resource_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_resource_backend
    environment:
      DATABASE_URL: "postgresql://ai_user:ai_secure_password_2026@postgres:5432/ai_resource_allocation?schema=public&pool_timeout=20"
      REDIS_URL: "redis://redis:6379"
      PORT: 5000
      JWT_SECRET: "enterprise_super_secret_jwt_key_2026"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: ai_resource_ml
    environment:
      DATABASE_URL: "postgresql://ai_user:ai_secure_password_2026@postgres:5432/ai_resource_allocation?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_resource_frontend
    environment:
      VITE_API_BASE_URL: "http://localhost:5000"
      VITE_ML_BASE_URL: "http://localhost:8000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

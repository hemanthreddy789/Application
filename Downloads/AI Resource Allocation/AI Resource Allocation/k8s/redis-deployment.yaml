apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-redis
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-redis
  template:
    metadata:
      labels:
        app: ai-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-redis
  namespace: default
spec:
  ports:
  - port: 6379
  selector:
    app: ai-redis

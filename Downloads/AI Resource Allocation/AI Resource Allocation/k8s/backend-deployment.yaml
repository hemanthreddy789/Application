apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-backend-config
  namespace: default
data:
  PORT: "5000"
  NODE_ENV: "production"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-backend-secret
  namespace: default
type: Opaque
stringData:
  DATABASE_URL: "postgresql://ai_user:ai_secure_password_2026@ai-postgres:5432/ai_resource_allocation?schema=public&pool_timeout=20"
  REDIS_URL: "redis://ai-redis:6379"
  JWT_SECRET: "enterprise_super_secret_jwt_key_2026"
  JWT_REFRESH_SECRET: "enterprise_super_refresh_secret_key_2026"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-backend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-backend
  template:
    metadata:
      labels:
        app: ai-backend
    spec:
      containers:
      - name: backend
        image: ai-resource-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: ai-backend-config
        - secretRef:
            name: ai-backend-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-backend
  namespace: default
spec:
  ports:
  - port: 5000
  selector:
    app: ai-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-backend-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75

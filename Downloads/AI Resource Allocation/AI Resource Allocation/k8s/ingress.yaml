apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-resource-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
  - host: ai-resource-allocation.enterprise.demo
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: ai-backend
            port:
              number: 5000
      - path: /ml
        pathType: Prefix
        backend:
          service:
            name: ai-ml-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-frontend
            port:
              number: 3000
